name: CD Production (Landing)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: landing-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy landing
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: production

    steps:
      - name: Check out deployment commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        env:
          # The Nuxt config contains build-time code that fetches and evaluates
          # a URL from AUTH_API_KEY. Do not expose that production secret to CI.
          AUTH_API_KEY: ''
          CI: '1'
        run: corepack yarn install --frozen-lockfile --non-interactive --production=false

      - name: Build Nuxt output
        env:
          AUTH_API_KEY: ''
          CI: '1'
          NODE_OPTIONS: --max-old-space-size=4096
          NUXT_PUBLIC_SITE_URL: ${{ vars.NUXT_PUBLIC_SITE_URL || 'https://esterholdings.com' }}
          NUXT_PUBLIC_HOST_BASE: ${{ vars.NUXT_PUBLIC_HOST_BASE || 'https://server.esterholdings.com' }}
          NUXT_PUBLIC_API_BASE: ${{ vars.NUXT_PUBLIC_API_BASE || 'https://server.esterholdings.com/api' }}
          NUXT_PUBLIC_CABINET_URL: ${{ vars.NUXT_PUBLIC_CABINET_URL || 'https://my.esterholdings.space' }}
        run: corepack yarn build

      - name: Validate and package Nuxt output
        run: |
          set -Eeuo pipefail
          test -s .output/server/index.mjs
          tar -czf landing-output.tar.gz .output
          ls -lh landing-output.tar.gz

      - name: Upload built output to production
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.LANDING_SSH_HOST }}
          username: ${{ secrets.LANDING_SSH_USER }}
          key: ${{ secrets.LANDING_SSH_KEY }}
          port: ${{ secrets.LANDING_SSH_PORT }}
          command_timeout: 2m
          source: landing-output.tar.gz
          target: ${{ vars.PROD_APP_DIR || '/var/www/landing.esterholdings.com' }}/.deploy/${{ github.sha }}
          overwrite: true

      - name: Activate built output on production
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ vars.PROD_APP_DIR || '/var/www/landing.esterholdings.com' }}
          PM2_APP_NAME: ${{ vars.PROD_PM2_APP_NAME || 'landing-esterholdings' }}
          APP_HOST: ${{ vars.PROD_APP_HOST || '127.0.0.1' }}
          APP_PORT: ${{ vars.PROD_APP_PORT || '3002' }}
          NODE_BIN_DIR: ${{ vars.PROD_NODE_BIN_DIR || '/opt/node-v20.20.1/bin' }}
          HEALTHCHECK_URL: ${{ vars.PROD_HEALTHCHECK_URL }}
          NODE_OPTIONS: ${{ vars.PROD_NODE_OPTIONS || '--max-old-space-size=4096' }}
          BRANCH: ${{ vars.PROD_DEPLOY_BRANCH || 'main' }}
          RELEASE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.LANDING_SSH_HOST }}
          username: ${{ secrets.LANDING_SSH_USER }}
          key: ${{ secrets.LANDING_SSH_KEY }}
          port: ${{ secrets.LANDING_SSH_PORT }}
          command_timeout: 2m
          envs: APP_DIR,PM2_APP_NAME,APP_HOST,APP_PORT,NODE_BIN_DIR,HEALTHCHECK_URL,NODE_OPTIONS,BRANCH,RELEASE_SHA
          script: |
            set -Eeuo pipefail

            [ -d "$APP_DIR/.git" ] || {
              echo "Production directory is not a Git checkout: $APP_DIR"
              exit 1
            }
            [ -w "$APP_DIR" ] || {
              echo "SSH user $(id -un) cannot write to $APP_DIR"
              exit 1
            }

            cd "$APP_DIR"
            if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
              echo "Production checkout contains tracked local changes. Deployment stopped."
              git status --short
              exit 1
            fi

            git fetch --prune origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            remote_head="$(git rev-parse --verify "origin/$BRANCH^{commit}")"
            current_head="$(git rev-parse --verify HEAD)"
            if [ "$current_head" != "$remote_head" ] &&
              ! git merge-base --is-ancestor "$current_head" "$remote_head"; then
              backup_ref="refs/deploy-backups/$BRANCH/$(date -u +%Y%m%d%H%M%S)"
              git update-ref "$backup_ref" "$current_head"
              echo "Saved diverged production HEAD $current_head to $backup_ref"
            fi
            git checkout -B "$BRANCH" "$remote_head"
            echo "Deploying commit $(git rev-parse --short HEAD)"

            deploy_script="$APP_DIR/scripts/deploy_prod.sh"
            [ -f "$deploy_script" ] || {
              echo "Deployment script not found: $deploy_script"
              exit 1
            }
            chmod +x "$deploy_script"
            "$deploy_script"
